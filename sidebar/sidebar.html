<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PageMortem</title>
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <header class="top">
    <div class="status" id="status" title="Model server status">
      <span class="dot" id="dot"></span>
      <span class="model" id="model">Connecting…</span>
    </div>
    <button class="icon" id="newChat" title="New conversation (also forgets “Always allow” choices)" aria-label="New conversation">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg>
    </button>
    <button class="icon" id="openSettings" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.5v2.2M10 15.3v2.2M2.5 10h2.2M15.3 10h2.2M4.7 4.7l1.6 1.6M13.7 13.7l1.6 1.6M4.7 15.3l1.6-1.6M13.7 6.3l1.6-1.6"/></svg>
    </button>
  </header>

  <div class="banner" id="banner" hidden>
    <p id="bannerText"></p>
    <div class="banner-actions" id="bannerActions"></div>
  </div>

  <details class="context-panel" id="contextPanel">
    <summary id="context">Context · current page</summary>
    <div class="context-body">
      <p class="context-help" id="contextHelp">Ask uses the pages below. Removing a source resets model conversation history, including earlier answers.</p>
      <label class="keep" id="keepWrap">
        <input type="checkbox" id="keepPages"> Keep earlier pages
      </label>
      <div id="contextList"></div>
      <div class="context-actions">
        <button class="btn" id="refreshSources">Refresh context</button>
        <label class="add-source">Add an open tab
          <select id="addSource"><option value="">Choose a tab…</option></select>
        </label>
      </div>
      <p id="contextStatus" class="context-help" role="status"></p>
    </div>
  </details>

  <div class="quick">
    <div class="split">
      <button id="summarize" class="chip">Summarize</button>
      <select id="summaryLength" aria-label="Summary length">
        <option value="brief">Brief</option>
        <option value="standard" selected>Standard</option>
        <option value="detailed">Detailed</option>
      </select>
    </div>
    <div class="split">
      <button id="translate" class="chip">Translate</button>
      <select id="lang" aria-label="Translate into"></select>
    </div>
    <button id="restore" class="chip ghost" hidden>Show original</button>
    <button id="groupTabs" class="chip" title="Suggest tab groups for this window's ungrouped tabs">Group tabs</button>
  </div>

  <main id="log" aria-live="polite"></main>

  <footer class="composer">
    <button class="jump" id="jump" hidden aria-label="Scroll to the latest message">↓ Latest</button>
    <div class="modes" role="radiogroup" aria-label="Mode" aria-describedby="modeHelp">
      <button role="radio" data-mode="ask" aria-checked="true" tabindex="0">Ask</button>
      <button role="radio" data-mode="agent" aria-checked="false" tabindex="-1">Agent</button>
    </div>
    <p class="mode-help" id="modeHelp">Reads the included pages. Does not interact with websites.</p>
    <div class="inputrow">
      <textarea id="input" rows="2" placeholder="Ask about this page…" aria-label="Message"></textarea>
      <button id="send" class="primary" aria-label="Send">Send</button>
    </div>
  </footer>

  <script src="../lib/settings.js"></script>
  <script src="../lib/llm.js"></script>
  <script src="../lib/tabs.js"></script>
  <script src="../lib/save.js"></script>
  <script src="../lib/markdown.js"></script>
  <script src="../lib/chat.js"></script>
  <script src="../lib/threads.js"></script>
  <script src="../lib/evidence.js"></script>
  <script src="../lib/agent.js"></script>
  <script src="../lib/groups.js"></script>
  <script src="sidebar.js"></script>
</body>
</html>
